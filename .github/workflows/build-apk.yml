name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      # حذف ملفات الويب المجمعة قديماً داخل مجلد أندرويد لتفادي تكرار الواجهة السابقة
      - name: Clean Old Android Assets
        run: |
          rm -rf android/app/src/main/assets/public
          rm -rf dist

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap copy android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon
          
          mkdir -p ../output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../output_apk/ \; || true
          cd ../output_apk
          if [ -f app-debug.apk ]; then
            cp -f app-debug.apk asmo-inventory-app.apk
            cp -f app-debug.apk asmo-inventory-debug.apk
          fi
          cd ..
          echo "=== Generated Native APKs ==="
          ls -lh output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASMO-Inventory-Capacitor-APK
          path: output_apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "ASMO Inventory App"
          body: |
            ## تحديث شامل لنظام أسمو:
            - تفعيل واجهة Gemini Vision بالكاميرا والألبوم.
            - تصدير ومشاركة ملفات Excel/CSV قابلة للتعديل.
            - تنظيف الملفات القديمة وبناء كود حديث 100%.
          files: |
            output_apk/asmo-inventory-app.apk
            output_apk/asmo-inventory-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
